name: Build and Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore askMeWindows.csproj

    - name: Build and publish Windows x64
      run: dotnet publish askMeWindows.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true /p:UseAppHost=true -o "release"

    - name: Create ZIP
      shell: pwsh
      run: Compress-Archive -Path release/* -DestinationPath askMeWindows-x64.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: askMeWindows-x64
        path: askMeWindows-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: askMeWindows-x64.zip
        token: ${{ secrets.GITHUB_TOKEN }}
